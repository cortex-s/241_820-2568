<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Register</title>

    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f4f6fb;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
      }

      * {
        box-sizing: border-box;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      body {
        margin: 0;
        background: #f6f7fb;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text);

        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      /* card */
      .container {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        padding: 28px 26px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      /* title */
      .header {
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 22px;
      }

      /* layout */
      .flex {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .form-input {
        margin-bottom: 14px;
      }

      .header-form {
        min-width: 80px;
        font-size: 13px;
        color: var(--muted);
      }

      /* inputs */
      .form,
      textarea {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font-size: 13px;
        outline: none;
      }

      .form:focus,
      textarea:focus {
        border-color: var(--primary);
      }

      textarea {
        min-height: 70px;
        resize: none;
      }

      /* checkbox radio */
      input[type="radio"],
      input[type="checkbox"] {
        accent-color: var(--primary);
        margin-right: 4px;
      }

      .gender .flex div {
        font-size: 13px;
      }

      /* button */
      .center {
        text-align: center;
        margin-top: 18px;
      }

      .button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 30px;
        font-size: 14px;
        border-radius: 8px;
        cursor: pointer;
      }

      .button:hover {
        opacity: 0.9;
      }

      /* link */
      .nav {
        position: absolute;
        top: 16px;
        left: 16px;
        font-size: 13px;
        text-decoration: none;
        color: #fff;
      }

      #alert-message {
        font-size: 13px;
        margin-top: 6px;
      }
    </style>
  </head>

  <body>
    <a class="nav" href="user.html">User Management</a>

    <div class="container">
      <div class="header">Register Form</div>

      <div class="flex form-input">
        <div class="header-form">ชื่อ</div>
        <input class="form" name="firstname" type="text" />
      </div>

      <div class="flex form-input">
        <div class="header-form">นามสกุล</div>
        <input class="form" name="lastname" type="text" />
      </div>

      <div class="flex form-input">
        <div class="header-form">อายุ</div>
        <input class="form" name="age" type="number" />
      </div>

      <div class="flex gender form-input">
        <div class="header-form">เพศ</div>
        <div class="flex">
          <div><input name="gender" type="radio" /> ชาย</div>
          <div><input name="gender" type="radio" /> หญิง</div>
          <div><input name="gender" type="radio" /> อื่นๆ</div>
        </div>
      </div>

      <div class="form-input">
        งานอดิเรก
        <div>
          <input name="interest" type="checkbox" value="อ่านหนังสือ" />
          อ่านหนังสือ
        </div>
        <div>
          <input name="interest" type="checkbox" value="ดูหนัง" /> ดูหนัง
        </div>
        <div>
          <input name="interest" type="checkbox" value="ฟังเพลง" /> ฟังเพลง
        </div>
      </div>

      <div class="form-input">
        คำอธิบาย
        <textarea name="description"></textarea>
      </div>

      <div id="alert-message" style="visibility: hidden"></div>

      <div class="center">
        <button onclick="submitData()" class="button">ส่งข้อมูล</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
