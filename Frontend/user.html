<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User List</title>

    <style>
      :root {
        --primary: #4f46e5;
        --danger: #ef4444;
        --bg1: #667eea;
        --bg2: #764ba2;
      }

      * {
        box-sizing: border-box;
        font-family: Inter, system-ui, Arial;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
      }

      /* back button */

      .back {
        position: absolute;
        top: 20px;
        left: 20px;
        text-decoration: none;
        background: white;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 14px;
        color: #333;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: 0.2s;
      }

      .back:hover {
        transform: translateY(-2px);
      }

      /* card */

      .container {
        width: 420px;
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      }

      /* title */

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      /* list */

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        margin-bottom: 12px;
        background: #f6f7ff;
        border-radius: 10px;
        border-left: 4px solid var(--primary);
        transition: 0.25s;
      }

      li:hover {
        transform: translateX(6px);
        background: #eef1ff;
      }

      /* username */

      .username {
        font-weight: 500;
        color: #333;
      }

      /* buttons */

      .actions {
        display: flex;
        gap: 6px;
      }

      button {
        border: none;
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        transition: 0.2s;
      }

      .edit {
        background: var(--primary);
      }

      .delete {
        background: var(--danger);
      }

      button:hover {
        opacity: 0.85;
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <a class="back" href="index.html">⬅ กลับหน้าแรก</a>

    <div class="container">
      <h1>👤 User List</h1>

      <ul id="user-list"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="user.js"></script>
  </body>
</html>
